<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Node Monitor</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><img class="brand-icon" src="assets/logo.svg" alt=""><span>Node Monitor</span></div><span class="update-label">Automatic refresh</span><button id="refresh" class="refresh" title="Refresh processes" aria-label="Refresh processes">↻</button><button id="open-settings" class="window-control" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l1.6-1.2-1.6-2.8-1.9.7a7.8 7.8 0 0 0-2.6-1.5l-.3-2h-3.2l-.3 2a7.8 7.8 0 0 0-2.6 1.5l-1.9-.7L5 9.3l1.6 1.2a7.7 7.7 0 0 0 0 3L5 14.7l1.6 2.8 1.9-.7a7.8 7.8 0 0 0 2.6 1.5l.3 2h3.2l.3-2a7.8 7.8 0 0 0 2.6-1.5l1.9.7 1.6-2.8z"/></svg></button><button id="minimize-window" class="window-control" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><button id="close-window" class="window-control window-close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <nav class="tabs" aria-label="View"><button class="tab active" data-mode="node" aria-pressed="true">Node</button><button class="tab" data-mode="ports" aria-pressed="false">Ports</button></nav>
    <div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search process, port or PID" aria-label="Search processes"><kbd>/</kbd></label></div>
    <div class="list-header"><span>PROCESSES</span><div class="list-actions"><span id="total-memory" class="total-memory">—</span><span id="total" class="total">—</span><button id="expand-all" class="group-control" title="Expand all" aria-label="Expand all"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="14" height="14" rx="3"/><path d="M3 16V6a3 3 0 0 1 3-3h10M10 13h6m-3-3v6"/></svg></button><button id="collapse-all" class="group-control" title="Collapse all" aria-label="Collapse all"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="14" height="14" rx="3"/><path d="M3 16V6a3 3 0 0 1 3-3h10M10 13h6"/></svg></button></div></div>
    <div id="list" class="list" aria-live="polite"></div>
  </main>
  <dialog id="process-dialog" aria-labelledby="dialog-title">
    <header class="dialog-header"><div><span class="dialog-label">PROCESS</span><h1 id="dialog-title"></h1></div><button id="close-dialog" class="close-dialog" aria-label="Close details">×</button></header>
    <dl id="process-details" class="process-details"></dl>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <header class="dialog-header"><div><span class="dialog-label">PREFERENCES</span><h1 id="settings-title">Settings</h1></div><button id="close-settings" class="close-dialog" aria-label="Close settings">×</button></header>
    <label class="setting-row"><span><strong>More details</strong><small>Show directory and parent process in the list</small></span><input id="more-details" type="checkbox" role="switch"></label>
    <label class="setting-row"><span><strong>Start with system</strong><small>Open Node Monitor when you sign in</small></span><input id="autostart" type="checkbox" role="switch" disabled></label>
    <label class="setting-row"><span><strong id="language-label">Language</strong></span><select id="language" aria-labelledby="language-label"><option value="en">English</option><option value="pt">Português</option><option value="es">Español</option></select></label>
    <p id="settings-error" class="settings-error" role="alert" hidden></p>
  </dialog>
  <dialog id="tray-dialog" aria-labelledby="tray-title" aria-describedby="tray-description">
    <div class="confirm-content"><span class="dialog-label">SYSTEM TRAY</span><h2 id="tray-title">Node Monitor is still running</h2><p id="tray-description">It will stay in the system tray. Double-click its icon to reopen it, or choose Quit from the tray menu.</p><div class="confirm-actions"><button id="tray-ok" class="confirm-cancel" autofocus>Got it</button></div></div>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
    <form method="dialog" class="confirm-content">
      <span class="dialog-label">CONFIRMATION</span><h2 id="confirm-title"></h2>
      <p id="confirm-description">Applications and their ongoing work may be interrupted.</p>
      <div class="confirm-actions"><button value="cancel" class="confirm-cancel" autofocus>Cancel</button><button value="confirm" id="confirm-submit" class="confirm-submit">Stop</button></div>
    </form>
  </dialog><script src="i18n.js"></script><script src="confirmation.js"></script><script src="grouping.js"></script><script src="display.js"></script><script src="renderer.js"></script>
</body></html>
