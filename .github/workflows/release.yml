name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage
          - os: windows-latest
            target: --win nsis
          - os: macos-15
            target: --mac dmg --arm64
          - os: macos-15-intel
            target: --mac dmg --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Verify macOS app executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle=$(find dist -maxdepth 2 -name 'Node Monitor.app' -print -quit)
          test -n "$bundle"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
          test -x "$bundle/Contents/MacOS/$executable"
          file "$bundle/Contents/MacOS/$executable"
          dmg=$(find dist -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          mountpoint=$(mktemp -d)
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          app="$mountpoint/Node Monitor.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test -x "$app/Contents/MacOS/$executable"
      - name: Capture English screenshot with demo data
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron scripts/screenshot.js "$RUNNER_TEMP/node-monitor-screenshot.png" --no-sandbox
      - name: Attach screenshot to the screenshots issue
        continue-on-error: true
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Screenshot for $GITHUB_REF_NAME with fictional data." --attach "$RUNNER_TEMP/node-monitor-screenshot.png#Node Monitor with fictional processes"
      - uses: actions/upload-artifact@v4
        with:
          name: node-monitor-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
          generate_release_notes: true
